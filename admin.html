<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord — Inscriptions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --blue-900:#0B2A5B;
    --blue-700:#123A7A;
    --blue-500:#1E56A8;
    --blue-100:#EAF0FB;
    --yellow:#FFC229;
    --yellow-dark:#E8A800;
    --ink:#16213A;
    --gray:#6B7484;
    --line:#E4E8F0;
    --green:#1B7A3D;
    --green-bg:#E7F6EC;
    --red:#C1272D;
    --red-bg:#FCEAEA;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', system-ui, sans-serif; background:#F6F8FC; color:var(--ink); line-height:1.5;}
  img,svg{display:block;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  a{color:inherit;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--white); border-radius:24px; padding:40px 32px; width:100%; max-width:380px;
    box-shadow:0 30px 60px -25px rgba(11,42,91,.25); text-align:center;
  }
  .login-logo{height:44px; width:auto; margin:0 auto 18px;}
  .login-card h1{font-size:19px; font-weight:800; color:var(--blue-900); text-transform:uppercase; margin-bottom:6px; letter-spacing:.01em;}
  .login-card p.sub{color:var(--gray); font-size:13.5px; margin-bottom:26px;}
  .field{text-align:left; margin-bottom:14px;}
  label{font-size:12.5px; font-weight:700; color:var(--blue-900); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; display:block;}
  input[type=email], input[type=password]{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-size:15px; color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--blue-500);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--yellow); color:var(--blue-900); font-weight:800; font-size:14px;
    padding:13px 20px; border-radius:999px; border:none; width:100%; margin-top:6px;
    transition:background .15s, transform .15s;
  }
  .btn:hover{background:var(--yellow-dark); transform:translateY(-1px);}
  .btn:disabled{opacity:.6; cursor:not-allowed; transform:none;}
  .login-error{
    background:var(--red-bg); color:var(--red); font-size:13px; font-weight:600;
    padding:10px 14px; border-radius:10px; margin-top:14px; display:none;
  }
  .login-error.show{display:block;}

  /* ---------- DASHBOARD ---------- */
  #dashboard{display:none;}
  header.topbar{
    background:var(--white); border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    position:sticky; top:0; z-index:10; flex-wrap:wrap;
  }
  .topbar-brand{display:flex; align-items:center; gap:10px;}
  .topbar-brand img{height:28px; width:auto;}
  .topbar-brand span{font-weight:800; color:var(--blue-900); font-size:14px; text-transform:uppercase; letter-spacing:.02em;}
  .topbar-right{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--gray);}
  .signout-btn{
    background:var(--white); border:1.5px solid var(--line); color:var(--blue-900);
    padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:700;
  }
  .signout-btn:hover{border-color:var(--blue-500);}

  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 80px;}

  .stats-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;}
  .stat-card{background:var(--white); border:1.5px solid var(--line); border-radius:14px; padding:16px; text-align:center;}
  .stat-card .num{font-size:26px; font-weight:900; color:var(--blue-900); line-height:1;}
  .stat-card .lbl{font-size:11.5px; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-top:6px;}
  @media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr);}}

  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
  .tabs{display:flex; gap:6px; background:var(--blue-100); padding:4px; border-radius:999px; flex-wrap:wrap;}
  .tab{background:transparent; border:none; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--blue-700);}
  .tab.active{background:var(--blue-900); color:var(--white);}
  .search-input{
    flex:1; min-width:180px; border:1.5px solid var(--line); border-radius:999px; padding:9px 16px; font-size:13.5px;
  }
  .search-input:focus{outline:none; border-color:var(--blue-500);}
  .refresh-btn{
    background:var(--white); border:1.5px solid var(--line); border-radius:999px; padding:9px 14px;
    font-size:12.5px; font-weight:700; color:var(--blue-900); display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover{border-color:var(--blue-500);}
  .refresh-btn svg{width:14px; height:14px;}
  .refresh-btn.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--gray); font-size:14px;
  }

  .reg-card{
    background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px; display:flex; flex-direction:column; gap:12px;
  }
  .reg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .reg-name{font-weight:800; color:var(--blue-900); font-size:16px;}
  .reg-date{font-size:12px; color:var(--gray); margin-top:2px;}
  .status-badge{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    padding:5px 12px; border-radius:999px; white-space:nowrap;
  }
  .status-badge.pending{background:#FFF4DB; color:#8A6100;}
  .status-badge.approved{background:var(--green-bg); color:var(--green);}
  .status-badge.rejected{background:var(--red-bg); color:var(--red);}

  .reg-details{display:grid; grid-template-columns:repeat(2,1fr); gap:8px 20px; font-size:13.5px;}
  @media(max-width:520px){.reg-details{grid-template-columns:1fr;}}
  .reg-details .d-label{color:var(--gray); font-size:11px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}
  .reg-details .d-value{color:var(--ink); font-weight:600;}
  .reg-details a{color:var(--blue-500); text-decoration:none;}
  .reg-details a:hover{text-decoration:underline;}

  .reg-actions{display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:12px;}
  .act-btn{
    flex:1; min-width:110px; padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.02em; border:1.5px solid transparent;
  }
  .act-btn.approve{background:var(--green-bg); color:var(--green); border-color:var(--green-bg);}
  .act-btn.approve:hover{background:var(--green); color:var(--white);}
  .act-btn.reject{background:var(--red-bg); color:var(--red); border-color:var(--red-bg);}
  .act-btn.reject:hover{background:var(--red); color:var(--white);}
  .act-btn.pending-btn{background:var(--blue-100); color:var(--blue-700);}
  .act-btn.pending-btn:hover{background:var(--blue-900); color:var(--white);}
  .act-btn.current{opacity:.45; cursor:default; pointer-events:none;}
  .act-btn:disabled{opacity:.5; cursor:wait;}

  .loading-row{text-align:center; padding:40px; color:var(--gray); font-size:14px;}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" alt="Karriere Bruecke">
    <h1>Tableau de bord</h1>
    <p class="sub">Connectez-vous pour voir et gérer les inscriptions.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Se connecter</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<div id="dashboard">
  <header class="topbar">
    <div class="topbar-brand">
      <img id="topbarLogo" alt="Karriere Bruecke">
      <span>Inscriptions — Congrès 2026</span>
    </div>
    <div class="topbar-right">
      <span id="adminEmail"></span>
      <button class="signout-btn" id="signOutBtn">Se déconnecter</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statAll">–</div><div class="lbl">Total</div></div>
      <div class="stat-card"><div class="num" id="statPending">–</div><div class="lbl">En attente</div></div>
      <div class="stat-card"><div class="num" id="statApproved">–</div><div class="lbl">Approuvées</div></div>
      <div class="stat-card"><div class="num" id="statRejected">–</div><div class="lbl">Refusées</div></div>
    </div>

    <div class="controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">Toutes</button>
        <button class="tab" data-filter="pending">En attente</button>
        <button class="tab" data-filter="approved">Approuvées</button>
        <button class="tab" data-filter="rejected">Refusées</button>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un nom, e-mail…">
      <button class="refresh-btn" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Actualiser
      </button>
    </div>

    <div id="listContainer">
      <div class="loading-row">Chargement…</div>
    </div>
  </div>
</div>

document.getElementById("loginLogo").src = "data:image/png;base64," + LOGO_B64;
document.getElementById("topbarLogo").src = "data:image/png;base64," + LOGO_B64;

const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const adminEmailEl = document.getElementById("adminEmail");

let allRows = [];
let currentFilter = "all";
let currentSearch = "";

function showDashboard(session){
  loginScreen.style.display = "none";
  dashboard.style.display = "block";
  adminEmailEl.textContent = session.user.email;
  loadRegistrations();
}
function showLogin(){
  loginScreen.style.display = "flex";
  dashboard.style.display = "none";
}

sb.auth.getSession().then(({ data }) => {
  if (data.session) showDashboard(data.session);
  else showLogin();
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.classList.remove("show");
  loginBtn.disabled = true;
  loginBtn.textContent = "Connexion…";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = "Se connecter";
  if (error){
    loginError.textContent = "E-mail ou mot de passe incorrect.";
    loginError.classList.add("show");
    return;
  }
  showDashboard(data.session);
});

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  showLogin();
});

async function loadRegistrations(){
  const container = document.getElementById("listContainer");
  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.classList.add("spinning");
  const { data, error } = await sb.from("registrations").select("*").order("created_at", { ascending:false });
  refreshBtn.classList.remove("spinning");
  if (error){
    container.innerHTML = '<div class="loading-row">Erreur de chargement. Réessayez.</div>';
    console.error(error);
    return;
  }
  allRows = data || [];
  updateStats();
  render();
}

function updateStats(){
  const counts = { all: allRows.length, pending:0, approved:0, rejected:0 };
  allRows.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
  document.getElementById("statAll").textContent = counts.all;
  document.getElementById("statPending").textContent = counts.pending;
  document.getElementById("statApproved").textContent = counts.approved;
  document.getElementById("statRejected").textContent = counts.rejected;
}

function render(){
  const container = document.getElementById("listContainer");
  let rows = allRows;
  if (currentFilter !== "all") rows = rows.filter(r => r.status === currentFilter);
  if (currentSearch.trim()){
    const q = currentSearch.trim().toLowerCase();
    rows = rows.filter(r =>
      (r.full_name || "").toLowerCase().includes(q) ||
      (r.email || "").toLowerCase().includes(q) ||
      (r.phone || "").toLowerCase().includes(q)
    );
  }

  if (rows.length === 0){
    container.innerHTML = '<div class="empty-state">Aucune inscription à afficher pour le moment.</div>';
    return;
  }

  const statusLabels = { pending:"En attente", approved:"Approuvée", rejected:"Refusée" };

  container.innerHTML = rows.map(r => {
    const date = r.created_at ? new Date(r.created_at).toLocaleString("fr-FR", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : "—";
    const status = r.status || "pending";
    const planLabel = r.plan ? (r.plan.charAt(0).toUpperCase() + r.plan.slice(1)) + (r.plan_price ? ` · ${r.plan_price}€` : "") : "—";
    return `
      <div class="reg-card" data-id="${r.id}">
        <div class="reg-top">
          <div>
            <div class="reg-name">${escapeHtml(r.full_name || "—")}</div>
            <div class="reg-date">Reçu le ${date}</div>
          </div>
          <span class="status-badge ${status}">${statusLabels[status] || status}</span>
        </div>
        <div class="reg-details">
          <div><div class="d-label">E-mail</div><div class="d-value"><a href="mailto:${escapeAttr(r.email)}">${escapeHtml(r.email || "—")}</a></div></div>
          <div><div class="d-label">Téléphone</div><div class="d-value"><a href="tel:${escapeAttr(r.phone)}">${escapeHtml(r.phone || "—")}</a></div></div>
          <div><div class="d-label">Formule</div><div class="d-value">${escapeHtml(planLabel)}</div></div>
          <div><div class="d-label">Langue</div><div class="d-value">${escapeHtml((r.language || "—").toUpperCase())}</div></div>
        </div>
        <div class="reg-actions">
          <button class="act-btn pending-btn ${status==='pending' ? 'current' : ''}" data-action="pending">En attente</button>
          <button class="act-btn approve ${status==='approved' ? 'current' : ''}" data-action="approved">Approuver</button>
          <button class="act-btn reject ${status==='rejected' ? 'current' : ''}" data-action="rejected">Refuser</button>
        </div>
      </div>
    `;
  }).join("");

  container.querySelectorAll(".act-btn:not(.current)").forEach(btn => {
    btn.addEventListener("click", () => updateStatus(btn.closest(".reg-card").dataset.id, btn.dataset.action, btn));
  });
}

async function updateStatus(id, newStatus, btnEl){
  const card = btnEl.closest(".reg-card");
  card.querySelectorAll(".act-btn").forEach(b => b.disabled = true);
  const { error } = await sb.from("registrations").update({ status:newStatus }).eq("id", id);
  if (error){
    alert("Une erreur est survenue. Réessayez.");
    console.error(error);
    card.querySelectorAll(".act-btn").forEach(b => b.disabled = false);
    return;
  }
  const row = allRows.find(r => r.id === id);
  if (row) row.status = newStatus;
  updateStats();
  render();
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  currentSearch = e.target.value;
  render();
});

document.getElementById("refreshBtn").addEventListener("click", loadRegistrations);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

// Light auto-refresh so new sign-ups appear without a manual click
setInterval(() => { if (dashboard.style.display !== "none") loadRegistrations(); }, 30000);
</script>
</body>
</html>
